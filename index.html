<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escapurr</title>
<meta name="description" content="Escapurr: a cozy cat puzzle game. Help the cat get out to the garden.">
<style>
  :root { --bg: #fbf7f2; --text: #3a2f45; --muted: #7a6e86; --accent: #c2506d; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #1f1b24; --text: #efe8f3; --muted: #b4a8bf; --accent: #f08aa4; }
  }
  :root[data-theme="dark"] { --bg: #1f1b24; --text: #efe8f3; --muted: #b4a8bf; --accent: #f08aa4; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 720px; margin: 0 auto; padding: 48px 16px; text-align: center; }
  h1 { color: var(--accent); font-size: 2.4rem; margin: 0 0 8px; }
  p { margin: 0 0 12px; }
  .muted { color: var(--muted); }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Escapurr</h1>
  <p>Help the cat get out to the garden.</p>
  <p class="muted">A cozy puzzle game for Android, by Vladyslav Chornyi.</p>
  <p><a href="privacy.html">Privacy policy</a> · <a href="mailto:chornogovlada@gmail.com">Contact</a></p>
</main>
</body>
</html>
